name: Report a bug
description: Tell us about an error or a feature that is not working as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve easyCAD3D. Please report one problem at a time.
        Posts and attachments are public. Do not include activation keys or private artwork.
  - type: input
    id: app-version
    attributes:
      label: easyCAD3D version
      description: Enter the version shown in easyCAD3D.
      placeholder: "For example: 0.9.198"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - SVG / Sketch
        - 3D Edit
        - Revolve / Sweep
        - Lithophane Maker
        - Other Automation tool
        - Opening, importing, saving, or exporting
        - Toolbars or panels
        - Installation or startup
        - Other / Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the shortest sequence that shows the problem.
      placeholder: |
        1. Open…
        2. Select…
        3. Click…
        4. The problem appears…
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 10 or Windows 11
  - type: input
    id: library-version
    attributes:
      label: Automation library name and version, if relevant
      description: Lithophane Maker displays its library version at the bottom.
      placeholder: "For example: Lithophane 1.3.0"
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or sample files
      description: Attach screenshots here. Put sample project files in a ZIP and share only files you can make public.
