name: Suggest an improvement
description: Suggest a new tool or a better way for an existing feature to work.
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to accomplish. Please keep each suggestion focused on one improvement.
        Check existing suggestions first; a 👍 reaction is a useful way to support an existing request.
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem this improvement would help with.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would you like easyCAD3D to do?
      description: Explain the change and how you would use it.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples, screenshots, or current workaround
      description: Optional. Show an example or describe how you handle this task today.
